<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDP  - Living Ecosystem</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
/* Password Gate */
#pw-gate{position:fixed;inset:0;z-index:9999;background:#0A0A0F;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif}
#pw-gate.hidden{display:none}
.pw-box{text-align:center;max-width:360px;padding:40px}
.pw-box h1{font-size:22px;font-weight:900;color:#F4F4F0;margin-bottom:6px;letter-spacing:-.02em}
.pw-box h1 b{color:#34D399}
.pw-box p{font-size:13px;color:#9A9AB0;margin-bottom:24px}
.pw-box input{width:100%;padding:14px 18px;border-radius:10px;border:1px solid #2A2A3E;background:#12121E;color:#F4F4F0;font-size:15px;text-align:center;outline:none;font-family:'Inter',system-ui,sans-serif;letter-spacing:.15em;transition:border-color .2s}
.pw-box input:focus{border-color:#34D399}
.pw-box input::placeholder{letter-spacing:normal;color:#5A5A70}
.pw-box button{margin-top:16px;padding:12px 32px;border-radius:10px;background:#34D399;color:#000;font-weight:800;font-size:14px;border:none;cursor:pointer;font-family:'Inter',system-ui,sans-serif;transition:opacity .2s}
.pw-box button:hover{opacity:.85}
.pw-err{color:#EF4444;font-size:12px;margin-top:12px;display:none}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0A0A0F;--surface:#12121E;--surface2:#1A1A2C;--surface3:#232338;
--border:#2A2A3E;--border2:#3A3A50;
--accent:#34D399;--accent2:#10B981;--accent-glow:rgba(52,211,153,0.12);
--green:#22C55E;--orange:#F59E0B;--blue:#3B82F6;--purple:#8B5CF6;--red:#EF4444;
--text:#F4F4F0;--text2:#9A9AB0;--text3:#5A5A70;
--shadow:rgba(0,0,0,0.5);--hover:rgba(52,211,153,0.06);
--r:12px;--rs:8px;--font:'Inter',system-ui,-apple-system,sans-serif;--t:.22s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
--bg:#F3F1EC;--surface:#FFFFFF;--surface2:#EDE9E3;--surface3:#E0DCD5;
--border:#CCC8BF;--border2:#B8B4AB;
--accent:#059669;--accent2:#047857;--accent-glow:rgba(5,150,105,0.08);
--green:#16A34A;--orange:#D97706;--blue:#2563EB;--purple:#7C3AED;--red:#DC2626;
--text:#111;--text2:#555;--text3:#888;
--shadow:rgba(0,0,0,0.06);--hover:rgba(5,150,105,0.04);
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;transition:background .3s,color .3s}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:var(--text)}
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
#hd{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(18,18,30,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(52,211,153,.1);z-index:100;flex-shrink:0;transition:background .3s}
[data-theme="light"] #hd{background:rgba(255,255,255,.95);border-bottom-color:rgba(0,0,0,.1)}
.hd-l{display:flex;align-items:center;gap:14px}
.hd-l h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
.hd-l h1 b{color:var(--accent)}
.hd-r{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:3px;background:rgba(10,10,15,.5);border-radius:var(--rs);padding:3px;border:1px solid rgba(52,211,153,.08)}
.tab{padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text3);transition:var(--t);letter-spacing:.02em}
.tab:hover{color:var(--text2);background:var(--surface2)}
.tab.on{background:var(--accent);color:#000;font-weight:700}
[data-theme="light"] .tabs{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.06)}
.langs{display:flex;gap:1px;background:var(--bg);border-radius:5px;padding:2px}
.lng{padding:3px 7px;border-radius:3px;font-size:10px;font-weight:700;color:var(--text3);transition:var(--t)}
.lng:hover{color:var(--text2)}
.lng.on{background:var(--surface2);color:var(--accent)}
.thm{width:34px;height:18px;border-radius:9px;background:var(--border);position:relative;cursor:pointer;transition:var(--t)}
.thm::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--accent);transition:var(--t)}
[data-theme="light"] .thm::after{left:16px}
.thm-icon{font-size:13px;cursor:pointer;line-height:1}

/* Main */
#mn{display:flex;flex:1;overflow:hidden;position:relative;background:radial-gradient(ellipse at center,rgba(52,211,153,.03) 0%,transparent 70%)}
#net{width:100%;height:100%}

/* Search */
#sb{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:50;width:400px;max-width:88vw}
#si{width:100%;padding:10px 16px 10px 38px;background:rgba(18,18,30,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(52,211,153,.15);border-radius:var(--r);color:var(--text);font-size:13px;outline:none;transition:var(--t);box-shadow:0 4px 24px rgba(0,0,0,.2)}
[data-theme="light"] #si{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08);box-shadow:0 4px 24px rgba(0,0,0,.04)}
#si:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
#si-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
#sr{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:rgba(18,18,30,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(52,211,153,.12);border-radius:var(--r);max-height:320px;overflow-y:auto;display:none;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#sr.v{display:block}
.sri{padding:9px 14px;cursor:pointer;transition:var(--t);display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);font-size:12px}
.sri:last-child{border:none}
.sri:hover{background:var(--hover)}
.sri-i{font-size:18px}
.sri-n{font-weight:600;font-size:12px}
.sri-c{font-size:10px;color:var(--text3)}
.sri-s{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:700}

/* Side Panel */
#sp{width:0;overflow:hidden;background:#12121E;border-left:1px solid rgba(52,211,153,.12);transition:width var(--t),background .3s;flex-shrink:0;position:relative;z-index:60}
[data-theme="light"] #sp{background:#FFFFFF}
#sp.open{width:500px}
#spi{width:500px;height:100%;overflow-y:auto;padding:22px}
.sx{position:absolute;top:12px;right:12px;font-size:16px;color:var(--text3);padding:4px 8px;border-radius:6px;transition:all var(--t)}
.sx:hover{background:rgba(52,211,153,.1);color:var(--accent);transform:scale(1.1)}
.sh{position:relative;margin-bottom:18px}
.sh-ic{font-size:36px;margin-bottom:6px;display:block}
.sh-t{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
.sh-cat{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:16px;font-size:9px;font-weight:700;margin-top:8px;text-transform:uppercase;letter-spacing:.06em}
.ss{margin-bottom:18px}
.ss-t{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:8px;border-bottom:1px solid rgba(52,211,153,.15);padding-bottom:6px}
.ss-d{font-size:14px;line-height:1.65;color:var(--text2)}
.ss-str{font-size:12px;line-height:1.55;color:var(--accent);font-weight:500;background:var(--accent-glow);padding:10px 12px;border-radius:var(--rs);border-left:3px solid var(--accent)}
.ss-hi{background:var(--accent-glow);border:1px solid var(--accent);border-radius:var(--rs);padding:10px 12px;margin-bottom:10px}
.ss-hi b{font-size:11px;color:var(--accent);display:block;margin-bottom:3px}
.ss-hi p{font-size:12px;color:var(--text);line-height:1.5}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mc{background:var(--bg);border-radius:var(--rs);padding:12px;border:1px solid var(--border);transition:all var(--t)}
.mc:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(52,211,153,.08)}
.mc-l{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.mc-v{font-size:20px;font-weight:900;margin-top:2px;color:var(--accent);letter-spacing:-.02em}
.mc-s{font-size:9px;color:var(--green);margin-top:1px}
.rl{display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;transition:all var(--t);font-size:12px;border-radius:6px;margin:1px 0}
.rl:hover{color:var(--accent);background:var(--accent-glow);padding-left:8px}
.rl-d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rl-a{color:var(--text3);font-size:11px}
.rl-n{font-weight:500}
.rl-t{font-size:10px;color:var(--text3);margin-left:auto}
.opp{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;cursor:pointer;transition:all var(--t)}
.opp:hover{border-color:var(--accent);color:var(--text);background:var(--accent-glow);transform:translateX(3px)}
.opp::before{content:"→";color:var(--accent);font-weight:700;font-size:13px;flex-shrink:0}
.desc-lead{font-size:15px;line-height:1.7;color:var(--text);font-weight:500;margin-bottom:12px}
.desc-body{font-size:14px;line-height:1.65;color:var(--text2)}
.desc-body p{margin-bottom:8px}
.desc-body p:last-child{margin-bottom:0}
.desc-fact{display:inline;background:var(--accent-glow);color:var(--accent);font-weight:600;padding:1px 5px;border-radius:4px;font-size:12px}
.desc-kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.desc-kv-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px}
.desc-kv-item .kv-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.desc-kv-item .kv-val{font-size:13px;font-weight:700;color:var(--accent);margin-top:1px}
/* Business Plan in side panel */
.bp-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.bp-nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rs);cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);transition:all var(--t);border:1px solid transparent}
.bp-nav-item:hover{background:var(--accent-glow);color:var(--text);border-color:rgba(52,211,153,.1)}
.bp-nav-item.bp-active{background:var(--accent-glow);color:var(--accent);border-color:rgba(52,211,153,.2);font-weight:700}
.bp-nav-item .bp-nav-icon{font-size:14px}
.bp-nav-item .bp-nav-num{font-size:9px;color:var(--text3);min-width:16px}
.bp-section{display:none;animation:fadeSlide .3s ease-out}
.bp-section.bp-visible{display:block}
.bp-section-title{font-size:16px;font-weight:800;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.bp-section-title span{font-size:20px}
.bp-footer{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.bp-btn{padding:8px 16px;border-radius:var(--rs);font-size:11px;font-weight:700;cursor:pointer;transition:all var(--t);border:1px solid var(--border);color:var(--text2);background:var(--bg)}
.bp-btn:hover{border-color:var(--accent);color:var(--accent)}
.bp-btn-primary{background:var(--accent);color:#000;border-color:var(--accent)}
.bp-btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.bp-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.bp-stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:10px;text-align:center}
.bp-stat-v{font-size:16px;font-weight:900;color:var(--accent);letter-spacing:-.02em}
.bp-stat-l{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.bp-p{font-size:13px;line-height:1.65;color:var(--text2);margin-bottom:10px}
.bp-p strong{color:var(--text);font-weight:700}
.bp-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.bp-cards-sm .bp-card{padding:8px 10px}
.bp-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:12px;transition:all var(--t)}
.bp-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.bp-card{cursor:pointer}
.bp-card-detail{display:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:10px;line-height:1.55;color:var(--text2)}
.bp-card.bp-card-open .bp-card-detail{display:block}
.bp-card.bp-card-open{grid-column:1/-1;border-color:var(--accent);background:var(--accent-glow)}
.bp-card-icon{font-size:18px;margin-bottom:4px}
.bp-card-t{font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px}
.bp-card-d{font-size:10px;line-height:1.5;color:var(--text2)}
.bp-timeline{position:relative;padding-left:28px;margin:10px 0}
.bp-timeline::before{content:\'\';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border)}
.bp-tl-item{position:relative;margin-bottom:14px}
.bp-tl-item::before{content:\'\';position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.bp-tl-launch::before{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.4)}
.bp-tl-week{font-size:9px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.bp-tl-title{font-size:12px;font-weight:700;color:var(--text)}
.bp-tl-desc{font-size:10px;color:var(--text2);line-height:1.5;margin-top:2px}
.bp-sub{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid rgba(52,211,153,.15)}
.bp-milestones{display:flex;flex-direction:column;gap:6px}
.bp-ms{display:flex;gap:10px;font-size:11px;align-items:baseline}
.bp-ms-date{font-weight:700;color:var(--accent);min-width:65px;font-size:10px}
.bp-ms-text{color:var(--text2)}
.bp-segments{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bp-seg{position:relative}
.bp-seg-bar{height:24px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;min-width:20px;opacity:.3}
.bp-seg-label{position:absolute;top:4px;left:8px;font-size:10px;font-weight:600;color:var(--text);display:flex;justify-content:space-between;width:calc(100% - 16px)}
.bp-seg-label span{color:var(--accent);font-weight:800}
.bp-quote{background:var(--accent-glow);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:11px;font-style:italic;color:var(--text2);line-height:1.55;margin:10px 0}
.bp-team{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bp-member{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:12px}
.bp-member-name{font-size:14px;font-weight:800;color:var(--text)}
.bp-member-role{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.bp-member-scope{font-size:11px;color:var(--text2);line-height:1.4}
.bp-member-comp{font-size:13px;font-weight:800;color:var(--accent);margin-top:4px}
.bp-note{font-size:10px;color:var(--text3);font-style:italic;line-height:1.5;margin-top:8px;padding:8px;background:var(--bg);border-radius:var(--rs)}
.bp-costs{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.bp-cost-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:11px;color:var(--text2);border-bottom:1px solid rgba(52,211,153,.06)}
.bp-cost-v{font-weight:700;color:var(--text);font-size:12px}
.bp-cost-total{display:flex;justify-content:space-between;padding:8px 10px;background:var(--accent-glow);border-radius:var(--rs);margin-top:4px}
.bp-cost-total span{font-weight:800;color:var(--accent);font-size:12px}
.bp-scenarios{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bp-scenario{background:var(--bg);border-radius:var(--rs);padding:12px;border-left:3px solid}
.bp-sc-caution{border-color:var(--red)}
.bp-sc-base{border-color:var(--accent)}
.bp-sc-up{border-color:var(--green)}
.bp-sc-name{font-size:12px;font-weight:800;color:var(--text);margin-bottom:2px}
.bp-sc-detail{font-size:10px;color:var(--text3)}
.bp-sc-rev{font-size:15px;font-weight:900;color:var(--accent);margin:4px 0 2px}
.bp-sc-margin{font-size:10px;color:var(--text2)}
.bp-invest-total{text-align:center;padding:18px;background:var(--accent-glow);border:1px solid rgba(52,211,153,.2);border-radius:var(--r);margin-bottom:14px}
.bp-invest-amount{font-size:28px;font-weight:900;color:var(--accent)}
.bp-invest-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.bp-checklist{display:flex;flex-direction:column;gap:6px}
.bp-check{display:flex;align-items:flex-start;gap:8px;padding:8px;background:var(--bg);border-radius:var(--rs);border:1px solid var(--border)}
.bp-check-status{font-size:14px}
.bp-check-item{font-size:11px;font-weight:600;color:var(--text)}
.bp-check-who{font-size:9px;color:var(--text3);margin-top:1px}
.bp-risks{display:flex;flex-direction:column;gap:8px}
.bp-risk{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:12px}
.bp-risk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bp-risk-name{font-size:12px;font-weight:700;color:var(--text)}
.bp-risk-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px}
.bp-risk-high{background:rgba(239,68,68,.15);color:var(--red)}
.bp-risk-med{background:rgba(245,158,11,.15);color:var(--orange)}
.bp-risk-low{background:rgba(34,197,94,.15);color:var(--green)}
.bp-risk-mit{font-size:10px;color:var(--text2);line-height:1.5}
.bp-expand{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.bp-exp-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:10px;display:flex;justify-content:space-between;align-items:center}
.bp-exp-mod{font-size:11px;font-weight:600;color:var(--text)}
.bp-exp-time{font-size:9px;color:var(--accent);font-weight:700;background:var(--accent-glow);padding:2px 6px;border-radius:4px}
.ptags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ptag{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:3px 10px;font-size:10px;font-weight:500;color:var(--text2)}
/* Testimonial */
.tq{background:var(--bg);border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;border:1px solid var(--border)}
.tq q{font-size:12px;color:var(--text2);line-height:1.5;font-style:italic}
.tq cite{font-size:10px;color:var(--accent);display:block;margin-top:4px;font-style:normal;font-weight:600}

.ss-toggle{cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;padding:2px 0;transition:color .2s}
.ss-toggle:hover{color:var(--text)}
.ss-toggle::after{content:'▸';font-size:11px;color:var(--accent);opacity:.5;transition:transform .25s,opacity .25s}
.ss-toggle:hover::after{opacity:1}
.ss-toggle.open::after{transform:rotate(90deg);opacity:1}
.ss-body{display:none;margin-top:7px}
.ss-body.open{display:block}

/* Side Panel Entry Animation */
#sp.open #spi{animation:fadeSlide .3s ease-out}
@keyframes fadeSlide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

/* Investor View */
#iv{display:none;position:absolute;inset:0;background:var(--bg);z-index:40;overflow-y:auto;transition:background .3s}
#iv.v{display:block}
.ivc{max-width:1020px;margin:0 auto;padding:44px 28px}
.ivh{text-align:center;margin-bottom:48px}
.ivh h2{font-size:36px;font-weight:900;letter-spacing:-.03em;margin-bottom:10px}
.ivh h2 b{color:var(--accent)}
.ivh p{font-size:15px;color:var(--text2);max-width:660px;margin:0 auto;line-height:1.65}
.ivhs{display:flex;justify-content:center;gap:28px;margin-top:24px;flex-wrap:wrap}
.ivhv{text-align:center}
.ivhv strong{font-size:26px;font-weight:900;color:var(--accent);display:block}
.ivhv small{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.ivs{margin-bottom:38px}
.ivs-t{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ivs-t::before{content:'';width:18px;height:2px;background:var(--accent);border-radius:1px}
.ivg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.icard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:all .25s ease;cursor:pointer}
.icard:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 32px rgba(52,211,153,.12)}
.icard-i{font-size:24px;margin-bottom:6px}
.icard-t{font-size:15px;font-weight:700;margin-bottom:5px}
.icard-d{font-size:12px;color:var(--text2);line-height:1.45}
.icard-s{margin-top:8px}
.ivl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ivli{background:var(--surface);border-left:3px solid var(--accent);border-radius:0 var(--rs) var(--rs) 0;padding:14px 18px;transition:background .3s}
.ivli b{font-size:13px;font-weight:700;display:block;margin-bottom:3px}
.ivli p{font-size:12px;color:var(--text2);line-height:1.45}
/* Testimonial grid */
.ivtg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ivtq{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.ivtq q{font-size:12px;color:var(--text2);line-height:1.5;font-style:italic;display:block}
.ivtq cite{font-size:11px;color:var(--accent);display:block;margin-top:6px;font-style:normal;font-weight:700}

/* Admin */
#ap{display:none;position:absolute;top:0;right:0;bottom:0;width:360px;background:rgba(18,18,30,1);border-left:1px solid rgba(52,211,153,.12);z-index:45;overflow-y:auto;padding:20px;transition:background .3s}
#ap.v{display:block}
.at{font-size:15px;font-weight:700;margin-bottom:14px}
.an{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border)}
.an-i{font-size:16px}
.an-n{flex:1;font-size:12px;font-weight:500}
.tgl{position:relative;width:32px;height:18px;background:var(--border);border-radius:9px;cursor:pointer;transition:var(--t)}
.tgl.on{background:var(--accent)}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:var(--t)}
.tgl.on::after{left:16px}

/* Legend */
#lg{position:absolute;bottom:14px;left:14px;background:rgba(18,18,30,.95);border:1px solid rgba(52,211,153,.1);border-radius:var(--r);padding:12px 16px;z-index:30;font-size:10px;transition:background .3s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
[data-theme="light"] #lg{background:rgba(255,255,255,.88);border-color:rgba(0,0,0,.06);box-shadow:0 4px 20px rgba(0,0,0,.06)}
.lg-t{font-weight:700;margin-bottom:5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-size:9px}
.lg-i{display:flex;align-items:center;gap:7px;padding:1px 0;color:var(--text2)}
.lg-d{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* Tooltip */
.vis-tooltip{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:var(--rs)!important;padding:10px 14px!important;color:var(--text)!important;font-family:var(--font)!important;font-size:11px!important;box-shadow:0 6px 28px var(--shadow)!important;max-width:280px!important;line-height:1.5!important}

.st-active{background:rgba(34,197,94,.15);color:var(--green)}

.st-planned{background:rgba(59,130,246,.15);color:var(--blue)}
.st-future{background:rgba(139,92,246,.15);color:var(--purple)}
.st-completed{background:rgba(107,114,128,.15);color:#6B7280}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

d:'PROOF OF CONCEPT  - CDP:s första kommersiella samarbete och beviset på att modellen fungerar. Jesper och Michelle tog en restaurang med noll Google-recensioner och byggde den till femstjärnig betyg genom: community-aktivering, social media-produktion, ny webbplats, IT-system, och hjälp med statliga bidrag. Ägarna säljer nu efter att CDP höjt verksamhetens värde markant. Detta är proof of concept: CDP:s ekosystem skapar mätbart affärsvärde för partners. Hub-modellen är repeterbar.|PROOF OF CONCEPT  - CDP\'s first commercial partnership proving the ecosystem model works. Jesper and Michelle took a restaurant with zero Google reviews and built it to five-star rating through: community activation, social media production, website redesign, IT systems, and government grant assistance. Owners chose to sell after CDP increased business value significantly. This proves: CDP\'s ecosystem creates measurable business value for partners. The Hub model is replicable.|PRUEBA DE CONCEPTO  - primer socio comercial de CDP demostrando que el modelo funciona. Restaurante transformado de cero reseñas a 5 estrellas mediante: activación comunitaria, producción de contenido, sistemas IT, ayuda con subsidios gubernamentales. Los dueños venden después de que CDP aumentara el valor del negocio. Esto prueba: el ecosistema CDP crea valor medible.|ДОКАЗАТЕЛЬСТВО КОНЦЕПЦИИ  - первое коммерческое партнёрство CDP. Ресторан преобразован с нуля отзывов на 5-звёздочный рейтинг. Владельцы продают после того, как CDP повысило стоимость бизнеса. Это доказывает: экосистема CDP создает измеримую ценность.',
st:'Proof of concept: CDP tog en okänd restaurang och byggde den till topp-rating med community, sociala medier, IT-system, hemsida, statliga bidrag och samarbeten. Bevisar Hub-modellens kraft.|Proof of concept: CDP took an unknown restaurant and built it to top rating through community, social media, IT systems, website, government grants and partnerships. Proves the Hub model works.',

d:'CDP.club (Coaches Don\'t Play Club)  - den fysiska lokalen vid Calle Bergantín 4, Torrevieja (f.d. Polka). Restaurang, hub, community-plats och café. SL (Sociedad Limitada) på gång, autónomo på gång, non-profit redan klar. ALLA licenser (alkohol, servering, mat) ingår i Polka-köpet  - plug and play. Launch: 1 maj 2026. CDP.club är den FÖRSTA merchanten i Beach Butler-nätverket (owned-first modell). Inomhus = CDP Hub Café med kiosker + app. Kombination av food, fitness, community och content på en plats. Pris: €90 000 (€10K entry, 4 års payback).|CDP.club (Coaches Don\'t Play Club)  - the physical location at Calle Bergantín 4, Torrevieja (formerly Polka). Restaurant, hub, community space and café. SL being set up. ALL licenses (alcohol, serving, food) included in the Polka purchase  - plug and play. Launch: May 1, 2026. CDP.club is the FIRST merchant in the Beach Butler network (owned-first model). Price: €90,000 (€10K entry, 4-year payback).|CDP.club  - local físico en Calle Bergantín 4, Torrevieja. Restaurante, hub, café. Todas las licencias incluidas. Lanzamiento: 1 mayo 2026.|CDP.club  - физическая локация на Calle Bergantín 4, Торревьеха. Ресторан, хаб, кафе. Все лицензии включены. Запуск: 1 мая 2026.',

{t:'Executive Summary|Executive Summary|Resumen Ejecutivo|Резюме',icon:'01',body:'<div class="bp-stats"><div class="bp-stat"><div class="bp-stat-v">€5,600–8,800</div><div class="bp-stat-l">Setup Cost</div></div><div class="bp-stat"><div class="bp-stat-v">€2,500/mo</div><div class="bp-stat-l">Hyra</div></div><div class="bp-stat"><div class="bp-stat-v">5 veckor</div><div class="bp-stat-l">Till launch</div></div><div class="bp-stat"><div class="bp-stat-v">40–50/dag</div><div class="bp-stat-l">Breakeven</div></div></div><p class="bp-p">Polka-lokalen blir CDP:s första fysiska enhet  - en lean bar/cafeteria som expanderar först efter validering. CDP:s community ger en inbyggd kundbas från dag ett. Noll cold-start.</p><p class="bp-p">Strategiskt värde: permanent plats för events, community, content-produktion, merch, partnerskap  - och bevisar att CDP Club-konceptet är lönsamt och replikerbart.</p>'},
{t:'Affärskoncept|Business Concept|Concepto de Negocio|Бизнес-концепция',icon:'02',body:'<div class="bp-cards"><div class="bp-card" onclick="this.classList.toggle(\'bp-card-open\')"><div class="bp-card-icon">▾</div><div class="bp-card-t">Bar & Cafeteria</div><div class="bp-card-d">Lean Phase 1: drycker, kaffe, enkel tapas, hälsosamma snacks. Ingen fullskalig restaurang. Minimerar personal, licensering och matsvinn.</div><div class="bp-card-detail">Konceptet bygger på en effektiv, lågkostnads-meny med fokus på kvalitet framför kvantitet. Drycker: specialty-kaffe, smoothies, juicer, vin, öl och cocktails. Mat: tapas, bowls, hälsosamma snacks och säsongsanpassade rätter. Ingen storskalig restaurangverksamhet i Fas 1 - detta minimerar personalbehov, licenskrav och matsvinn. Köksexpansion sker först efter validering i sommarperioden. POS-system med kiosk-beställning och app-integration via Beach Butler.</div></div><div class="bp-card" onclick="this.classList.toggle(\'bp-card-open\')"><div class="bp-card-icon">◐</div><div class="bp-card-t">Utomhusmiljö</div><div class="bp-card-d">Costa del Sol = uteservering är huvudattraktionen. 8-10 månader per år. Komfort, estetik och community-känsla.</div><div class="bp-card-detail">Utomhusmiljön är CDP Clubs viktigaste konkurrensfördel. Torrevieja erbjuder 300+ soldagar per år, vilket möjliggör uteservering 8-10 månader. Designen fokuserar på komfort (bekväma sittplatser, skugga, belysning), estetik (CDP-varumärke, grönska, Medelhavsatmosfär) och gemenskap (gruppvänliga ytor, event-layout). Professionellt musiksystem med noggrant anpassade ljudnivåer - tillräckligt för atmosfär men aldrig störande för grannar eller konversationer. SGAE-licens och bullerregler följs strikt. Målet är Torreviejas bästa utomhusupplevelse - en destination, inte bara ett ställe att äta.</div></div><div class="bp-card" onclick="this.classList.toggle(\'bp-card-open\')"><div class="bp-card-icon">●●</div><div class="bp-card-t">Community Hub</div><div class="bp-card-d">Inte ett vanligt café. Community-ankare. 200+ aktiva medlemmar + content engine som driver fottrafik utan betald annonsering.</div><div class="bp-card-detail">CDP Club är designat som en samlingspunkt för hela ekosystemet. Här möts stamgäster, nya besökare och community-medlemmar. En naturlig samlingsplats för gemenskap och upplevelser. Frukost och kaffe under dagen, events på kvällen. Varje besökare blir en potentiell ambassadör som delar sin upplevelse organiskt. Med 200+ aktiva community-medlemmar och 12 900+ Instagram-följare har CDP en inbyggd kundbas som ingen konkurrent kan replikera.</div></div><div class="bp-card" onclick="this.classList.toggle(\'bp-card-open\')"><div class="bp-card-icon">◆</div><div class="bp-card-t">Proof of Concept</div><div class="bp-card-d">Validering: Fungerar CDP:s community-modell som fysisk hospitality? Lyckas = repeterbar CDP Club-playbook.</div><div class="bp-card-detail">CDP.club är det strategiska testet. Om CDP kan driva en framgångsrik fysisk verksamhet med sin community-first-modell, bekräftar det hela affärstesen. Framgång här innebär att modellen kan replikeras i andra kuststäder. Varje ny location använder samma playbook: community-aktivering, content-produktion, event-hosting och ekosystem-integration. Mätbara milstolpar: breakeven inom 3 månader, positiv marginal från månad 4, validerad meny och drift efter 12 månaders granskning.</div></div></div>'},
{t:'Rollout & Launch|Rollout & Launch|Lanzamiento|Запуск',icon:'03',body:'<div class="bp-timeline"><div class="bp-tl-item"><div class="bp-tl-week">V1</div><div class="bp-tl-body"><div class="bp-tl-title">Reset & Städning</div><div class="bp-tl-desc">Djuprengöring, ta bort tidigare hyresgästs inventarier, dokumentera skick, identifiera reparationer.</div></div></div><div class="bp-tl-item"><div class="bp-tl-week">V2</div><div class="bp-tl-body"><div class="bp-tl-title">Miljö & Setup</div><div class="bp-tl-desc">Uteservering, belysning, skyltar, möbler, CDP-estetik.</div></div></div><div class="bp-tl-item"><div class="bp-tl-week">V3</div><div class="bp-tl-body"><div class="bp-tl-title">Rebranding</div><div class="bp-tl-desc">Ta bort Polka-identitet. CDP Club-varumärke. Skyltar, menyer, Google Maps.</div></div></div><div class="bp-tl-item"><div class="bp-tl-week">V4</div><div class="bp-tl-body"><div class="bp-tl-title">Administration</div><div class="bp-tl-desc">Bolagsregistrering, bankkonto, POS/betalning, bokföring, leverantörer.</div></div></div><div class="bp-tl-item bp-tl-launch"><div class="bp-tl-week">V5</div><div class="bp-tl-body"><div class="bp-tl-title">★ Launch</div><div class="bp-tl-desc">Soft opening med community. Feedback. Justering. Officiell öppning.</div></div></div></div><div class="bp-sub">År 1 Milstolpar</div><div class="bp-milestones"><div class="bp-ms"><span class="bp-ms-date">Maj 2026</span><span class="bp-ms-text">Lean launch  - bar, kaffe, enkel tapas</span></div><div class="bp-ms"><span class="bp-ms-date">Jun–Aug</span><span class="bp-ms-text">Sommarvalidering, menyutveckling, köksexpansion om godkänt</span></div><div class="bp-ms"><span class="bp-ms-date">Sep–Nov</span><span class="bp-ms-text">Lågsäsongstest, året-runt-livsduglighet</span></div><div class="bp-ms"><span class="bp-ms-date">Dec–Apr</span><span class="bp-ms-text">Fullständig granskning. Fortsätt, expandera eller pivotera.</span></div></div>'},
{t:'Marknad & Position|Market & Position|Mercado y Posición|Рынок и позиция',icon:'04',body:'<p class="bp-p"><strong>Torrevieja är Spaniens snabbast växande stad.</strong> Borgmästaren har uttalat ambitionen att göra Torrevieja till Spaniens främsta sportstad. CDP är perfekt positionerat i denna tillväxt  - differentiering kommer inte från menyn, utan från ekosystemet.</p><div class="bp-cards"><div class="bp-card"><div class="bp-card-icon">▣</div><div class="bp-card-t">Community-driven</div><div class="bp-card-d">Aktiv, lojalitetsdriven gemenskap som besöker regelbundet och tar med nya via word-of-mouth.</div></div><div class="bp-card"><div class="bp-card-icon">▶</div><div class="bp-card-t">Content Engine</div><div class="bp-card-d">Organisk digital synlighet  - venue som destination, inte bekvämlighetsställe.</div></div><div class="bp-card"><div class="bp-card-icon">★</div><div class="bp-card-t">Lifestyle-brand</div><div class="bp-card-d">Hälsa, disciplin, livsstil  - växande hälsomedveten demografi.</div></div><div class="bp-card"><div class="bp-card-icon">⊕</div><div class="bp-card-t">Nätverkseffekt</div><div class="bp-card-d">Events, varumärke och social media = flera anledningar till återbesök.</div></div></div><div class="bp-sub">Kundsegment</div><div class="bp-segments"><div class="bp-seg"><div class="bp-seg-bar" style="width:45%"></div><div class="bp-seg-label">CDP Community <span>40–50%</span></div></div><div class="bp-seg"><div class="bp-seg-bar" style="width:25%"></div><div class="bp-seg-label">Hälsomedvetna Expats <span>20–30%</span></div></div><div class="bp-seg"><div class="bp-seg-bar" style="width:17%"></div><div class="bp-seg-label">Lokala invånare <span>15–20%</span></div></div><div class="bp-seg"><div class="bp-seg-bar" style="width:12%"></div><div class="bp-seg-label">Walk-in / Turister <span>10–15%</span></div></div></div><div class="bp-quote">En konkurrent kan kopiera menyn men kan inte kopiera 200+ aktiva community-medlemmar, Instagram-följarskaran eller eventkalendern.</div>'},
{t:'Team & Roller|Team & Roles|Equipo y Roles|Команда и роли',icon:'05',body:'<div class="bp-team"><div class="bp-member"><div class="bp-member-name">Michelle</div><div class="bp-member-role">Owner / Operator</div><div class="bp-member-scope">Daglig drift, kundupplevelse, leverantörer, on-site ledarskap</div><div class="bp-member-comp">€1,500/mo</div></div><div class="bp-member"><div class="bp-member-name">Dhaval</div><div class="bp-member-role">Ekonomi & Bokföring</div><div class="bp-member-scope">Bokföring, skatt, compliance, finansrapportering</div><div class="bp-member-comp">€1,200–1,500/mo</div></div><div class="bp-member"><div class="bp-member-name">Sanna</div><div class="bp-member-role">Content & Brand</div><div class="bp-member-scope">Social media, foto/video, varumärke, marknadsföring</div><div class="bp-member-comp">€1,200–1,500/mo</div></div><div class="bp-member"><div class="bp-member-name">Jesper</div><div class="bp-member-role">Business Development</div><div class="bp-member-scope">Strategisk riktning, partnerskap, investerarrelationer, ekosystem</div><div class="bp-member-comp">€1,000–1,500/mo</div></div></div><p class="bp-note"><strong>Varför är teamkostnaderna låga?</strong> CDP är ett familjeägt koncept med en stark community-driven modell. Teamet drivs av passion, delägarskap och gemensam passion för projektet  - inte av marknadsmässiga löner. Varje teammedlem har multipla roller och bidrar brett till verksamheten. Det gör att vi kan hålla nere fasta kostnader utan att kompromissa på kvalitet. Siffrorna är uppskattningar. Struktur ej fastställd (anställd, autónomo eller tjänsteavtal). Spansk arbetsgivaravgift tillkommer ~30–35%.</p>'},
{t:'Ekonomi & Finanser|Economy & Finance|Economía y Finanzas|Экономика и финансы',icon:'06',body:'<div class="bp-sub">Setup-kostnader</div><div class="bp-costs"><div class="bp-cost-item"><span>Djuprengöring</span><span class="bp-cost-v">€500–800</span></div><div class="bp-cost-item"><span>Utemöbler & setup</span><span class="bp-cost-v">€1,500–2,000</span></div><div class="bp-cost-item"><span>Inredning</span><span class="bp-cost-v">€1,000–1,500</span></div><div class="bp-cost-item"><span>Skyltar & branding</span><span class="bp-cost-v">€500–800</span></div><div class="bp-cost-item"><span>POS-system</span><span class="bp-cost-v">€300–500</span></div><div class="bp-cost-item"><span>Initialt lager</span><span class="bp-cost-v">€800–1,200</span></div><div class="bp-cost-item"><span>Admin & juridik</span><span class="bp-cost-v">€500–1,000</span></div><div class="bp-cost-item"><span>Reserv</span><span class="bp-cost-v">€500–1,000</span></div><div class="bp-cost-total"><span>TOTALT SETUP</span><span class="bp-cost-v">€5,600–8,800</span></div></div><div class="bp-sub">Månatliga fasta kostnader</div><div class="bp-costs"><div class="bp-cost-item"><span>Hyra</span><span class="bp-cost-v">€2,500</span></div><div class="bp-cost-item"><span>Team (4 pers)</span><span class="bp-cost-v">€4,900–6,000</span></div><div class="bp-cost-item"><span>Utilities</span><span class="bp-cost-v">€400–600</span></div><div class="bp-cost-item"><span>Försäkring</span><span class="bp-cost-v">€150–250</span></div><div class="bp-cost-item"><span>Bokföring/gestor</span><span class="bp-cost-v">€200–350</span></div><div class="bp-cost-item"><span>Övrigt</span><span class="bp-cost-v">€510–980</span></div><div class="bp-cost-total"><span>TOTALT/MÅNAD</span><span class="bp-cost-v">€8,660–10,680</span></div></div><div class="bp-sub">Intäktsscenarier</div><div class="bp-scenarios"><div class="bp-scenario bp-sc-caution"><div class="bp-sc-name">Försiktig</div><div class="bp-sc-detail">30–40 kunder/dag × €8–10</d {t:'Investering|Investment|Inversión|Инвестиции',icon:'07',body:'<div class="bp-invest-total"><div class="bp-invest-amount">€20,000–30,000</div><div class="bp-invest-label">Totalt kapitalbehov</div></div><div class="bp-costs"><div class="bp-cost-item"><span>Setup & renovering</span><span class="bp-cost-v">€5,600–8,800</span></div><div class="bp-cost-item"><span>Driftbudget (3 mån)</span><span class="bp-cost-v">€10,000–15,000</span></div><div class="bp-cost-item"><span>Rörelsekapital & reserv</span><span class="bp-cost-v">€4,000–6,000</span></div></div><div class="bp-sub">Riskreducering</div><div class="bp-cards bp-cards-sm"><div class="bp-card"><div class="bp-card-icon">₵</div><div class="bp-card-d">Låg initial investering vs nybygge</div></div><div class="bp-card"><div class="bp-card-icon">⊡</div><div class="bp-card-d">Befintlig lokal  - ingen byggrisk</div></div><div class="bp-card"><div class="bp-card-icon">●●</div><div class="bp-card-d">Inbyggd kundbas  - inget cold-start</div></div><div class="bp-card"><div class="bp-card-icon">KPI</div><div class="bp-card-d">Fasad expansion  - inkrementellt</div></div><div class="bp-card"><div class="bp-card-icon">✓</div><div class="bp-card-d">12 mån validering med review gates</div></div><div class="bp-card"><div class="bp-card-icon">◎</div><div class="bp-card-d">Validerar CDP Club-modellen</div></div></div><div class="bp-quote">Kassaflödes-breakeven inom 2–3 månader. Positiv marginal från månad 4. ROI inom 8–14 månader.</div>'},

{t:'Trygghet & Säkring|Risk & Mitigation|Riesgos y Mitigación|Риски и снижение',icon:'09',body:'<div class="bp-risks"><div class="bp-risk"><div class="bp-risk-head"><span class="bp-risk-name">Licensförseningar</span><span class="bp-risk-badge bp-risk-med">Medel / Hög</span></div><div class="bp-risk-mit">Anlita gestor direkt. Starta med bar-only. Köksexpansion väntar på godkännande.</div></div><div class="bp-risk"><div class="bp-risk-head"><span class="bp-risk-name">Intäkter under breakeven</span><span class="bp-risk-badge bp-risk-med">Medel / Hög</span></div><div class="bp-risk-mit">Lean kostnad. 3 mån runway. Meny/tider-justering. Community-aktivering.</div></div><div class="bp-risk"><div class="bp-risk-head"><span class="bp-risk-name">Säsongsvariation</span><span class="bp-risk-badge bp-risk-high">Hög / Medel</span></div><div class="bp-risk-mit">Kostnadsreduktion lågsäsong. Diversifiera med events. Bygg lokal stamkundsbas.</div></div><div class="bp-risk"><div class="bp-risk-head"><span class="bp-risk-name">Nyckelpersonberoende</span><span class="bp-risk-badge bp-risk-med">Medel / Medel</span></div><div class="bp-risk-mit">Korsutbilda. Dokumentera rutiner. Undvik single points of failure.</div></div><div class="bp-risk"><div class="bp-risk-head"><span class="bp-risk-name">Hyresrisk</span><span class="bp-risk-badge bp-risk-low">Låg / Hög</span></div><div class="bp-risk-mit">Säkra bra villkor. Begränsa initial investering.</div></div></div>'},

{id:'cdp_gym',i:'FIT',l:'CDP Gym (Separat)|CDP Gym (Separate)|CDP Gym (Separado)|CDP Gym (Отдельный)',c:'core',s:'planned',
d:'CDP Gym  - separat entitet och separat del av lokalen vid Calle Bergantín 4. Företagsmässigt och fysiskt uppdelat från CDP.club-restaurangen. 200 kvm gym-yta. Fullt utrustad gym + community space. Baserat på alla lärdomar från det gratis outdoor gym som CDP drivit i 2+ år. Blir CDP:s flaggskepps-indoor-gym  - komplement till det befintliga gratis outdoor gym vid stranden. Separat bolag, separat yta, men integrerat i CDP-ekosystemet.|CDP Gym  - separate entity and separate part of the location at Calle Bergantín 4. Separate company and physically divided from the CDP.club restaurant. 200 sqm gym area. Fully equipped gym + community space. Based on all lessons from 2+ years of free outdoor gym. Separate company but integrated in the CDP ecosystem.|CDP Gym  - entidad separada en Calle Bergantín 4. 200 m² de gimnasio. Empresa separada pero integrada en el ecosistema CDP.|CDP Gym  - отдельная сущность на Calle Bergantín 4. 200 м² зал. Отдельная компания, интегрированная в экосистему CDP.',
st:'Separat bolag + separat lokal = tydlig juridisk och operativ separation. Gymmet kompletterar outdoor gym och ger year-round träning oberoende av väder.|Separate company + separate space = clear legal and operational separation. Complements outdoor gym with year-round weather-independent training.',
m:[{l:'location',v:'Bergantín 4',s:'200 kvm'},{l:'type',v:'Indoor Gym',s:'Separat bolag'},{l:'status',v:'Planerat',s:'2026'}],

{id:'retreats',i:'RT',l:'Retreats|Retreats|Retiros|Ретриты',c:'growth',s:'active',
d:'Premium multi-dagars reset retreats. Träning, yoga, nervsystemsarbete, gemenskap, planerade måltider, natur. UTSÅLDA utan reklam  - enbart community word-of-mouth. Revenue-modell: €500-1,500 per deltagare, 15-30 deltagare per retreat. 4 retreats per år = €30K-180K årlig intäkt. Extremt hög marginal (60-80%) då faciliteter hyrs temporärt och tränare redan finns i teamet. Retreat-deltagare har 3x högre sannolikhet att bli långsiktiga betalande medlemmar. Varje retreat genererar 50+ content pieces. High-margin transformation + loyalty engine + content documentation.|Premium multi-day reset retreats. Fitness, yoga, nervous system work, community, planned meals, nature. SOLD OUT without advertising  - community word-of-mouth only. Revenue model: €500-1,500 per participant, 15-30 per retreat. 4 retreats/year = €30K-180K annual revenue. Very high margin (60-80%) since facilities are rented temporarily and trainers are already on the team. Retreat participants are 3x more likely to become long-term paying members. Each retreat generates 50+ content pieces.|Retiros premium de varios días. AGOTADOS sin publicidad.|Премиум многодневные ретриты. РАСПРОДАНЫ без рекламы.',
st:'Högsta revenue per deltagare. Starkaste content. Djupaste relationerna. Starkaste ambassadörerna.',
m:[{l:'Revenue/retreat',v:'€7.5-45K',s:'Per event'},{l:'Margin',v:'60-80%',s:'High-margin'},{l:'Participants',v:'15-30',s:'Per retreat'},{l:'Annual',v:'€30-180K',s:'4 retreats/year'}],
o:['Kvartalsvisa retreats (4/år)|Quarterly retreats','Tematiska: Disciplin, Reset, Leadership|Themed retreats','Partner-retreats med lokala venues|Partner retreats','Branded retreat-produkter|Branded retreat products'],iv:true},

{id:'content',i:'▷',l:'Content Engine|Content Engine|Motor de Contenido|Контент-движок',c:'growth',s:'active',
d:'1 276+ publicerade IG-inlägg. Sanna (filmskola) leder content strategy. Varje pass → 3-5 content pieces. Varje event → 10-20. Varje retreat → 50+. 90-Day Challenge: 100 deltagare × 90 dagar = 4.5M impressions. Community genererar UGC automatiskt. Event hosting skapar massivt content  - wine tastings, Swedish dinners, fester. YouTube-dokuserie planerad.|1,276+ IG posts. Sanna leads content strategy. Every session → 3-5 pieces. 90-Day Challenge = 4.5M impressions potential. Event hosting creates massive content  - wine tastings, dinners, parties. YouTube documentary series planned.|Más de 1.276 posts. Cada sesión → 3-5 piezas. El event hosting genera contenido masivo.|Ивент-хостинг создаёт массивный контент. Документальный YouTube-сериал.',

{id:'partnerships',i:'⬡',l:'Partnerskap|Partnerships|Asociaciones|Партнёрства',c:'growth',s:'active',
d:'Aktivt ekosystem av lokala och regionala partners som CDP samarbetar med på gemensamma tillväxtvillkor. Sagoro (joint events, studentutbyte), padel-centers (community events), golfklubbar (content & video), wine tasting (event hosting), barbershops (video-produktion), restauranger (content & community), Svensk Skolan (school partnership), caféer (activation). CDP driver försäljning, content och varumärkesvärde för partners genom sin community på 59 länder. Partner Network = en av 9 behavior engines.|Active partnership network across Torrevieja/Costa Blanca. Sagoro (joint events, student exchange), padel centers (community events), golf clubs (content & video production), wine tasting (large guest events), barbershops (video content), restaurants (content & community), Svensk Skolan (school collab), cafés (activation). Partners gain exposure to engaged international community, content production, and revenue opportunities. Partner Network = one of 9 behavior engines.|Red activa de socios locales. Sagoro, centros de pádel, clubes de golf, catas de vino, peluquerías, restaurantes, Colegio Sueco, cafés. CDP proporciona producción de contenido, activación comunitaria y crecimiento de ventas. Socios acceden a comunidad de 59 países.|Активная сеть партнёров. Sagoro, центры паделя, гольф-клубы, винотастинги, парикмахерские, рестораны, шведская школа, кафе. CDP обеспечивает контент, активацию и рост продаж.',
pt:['Sagoro Surf School','Padel Centers (Torrevieja)','Costa Blanca Golf Clubs','Wine Tasting Events','Barbershops (Torrevieja)','Restaurants','Svensk Skolan','Cafés & Coffee','Oceanflyers'],

{id:'beach_butler',i:'BB',l:'Beach Butler|Beach Butler|Beach Butler|Beach Butler',c:'growth',s:'in_progress',
d:'SEPARAT TECH-PLATTFORM  - marketplace/delivery-layer för stränder. "Show up with nothing, have everything." On-demand mat, dryck och utrustning (parasoll, stolar, handdukar) direkt till strandplatsen via app/webb/kiosk. Bowl-first matsystem (<30 sek assembly, inga seed oils). Tre intents: Äta & Dricka, Forgot Everything, Beach Setup. SEPARAT BOLAG från CDP.club. CDP.club är FÖRSTA merchant (owned-first), sedan curated external partners. Pilot: Torrevieja, juni 2026. Tech: PWA-first, Node.js/Fastify/PostgreSQL/React, Stripe. €150-180K Year 1 investering. Break-even månad 4-6.|SEPARATE TECH PLATFORM  - marketplace/delivery layer for beaches. "Show up with nothing, have everything." On-demand food, drinks and equipment delivered to your beach spot. Bowl-first food system. Three intents: Eat & Drink, Forgot Everything, Beach Setup. SEPARATE COMPANY from CDP.club. CDP.club is FIRST merchant (owned-first). Pilot: Torrevieja, June 2026. €150-180K Year 1 investment. Break-even month 4-6.|PLATAFORMA TECH SEPARADA  - marketplace para playas. "Llega sin nada, ten todo." Comida, bebidas y equipo bajo demanda. Piloto: Torrevieja, junio 2026.|ОТДЕЛЬНАЯ ТЕХ-ПЛАТФОРМА  - маркетплейс для пляжей. Еда, напитки и оборудование по запросу. Пилот: Торревьеха, июнь 2026.',
st:'Beach Butler = ren tech-plattform. Runners anställs av MERCHANTEN (CDP.club), inte av BB. Undviker Ley Rider. Franchise-modell: Tier 1 (food truck €500/mån + 5%) → Tier 2 (full flagship €3K/mån + 8%). TAM strand-mat Europa: €1.6-2.4B/år.|Beach Butler = pure tech platform. Runners employed by MERCHANT, not BB. Avoids Ley Rider. Franchise model: Tier 1 (food truck) → Tier 2 (full flagship). TAM beach food Europe: €1.6-2.4B/year.',
m:[{l:'rev',v:'€93-144K',s:'År 1 (adj.)'},{l:'rev',v:'€150-180K',s:'Investering'},{l:'be',v:'4-6',s:'Månader'},{l:'team',v:'9 agenter',s:'AI-team'}],

function fmtDesc(raw){
const sents=raw.split(/\.\s+/).filter(s=>s.trim());if(!sents.length)return raw;
const lead=sents[0]+(sents[0].endsWith('.')?'':'.');
const rest=sents.slice(1);
let html=`<div class="desc-lead">${hlFacts(lead)}</div>`;
if(rest.length){
const paras=[];let cur=[];
rest.forEach(s=>{cur.push(s+(s.endsWith('.')?'':'.'));if(cur.length>=2){paras.push(cur.join(' '));cur=[];}});
if(cur.length)paras.push(cur.join(' '));
html+=`<div class="desc-body">${paras.map(p=>'<p>'+hlFacts(p)+'</p>').join('')}</div>`;
}
const kvs=[];
const priceM=raw.match(/(?:Pris|Price|Precio|Цена)[:\s]*([€$£][\d\s.,KkMm]+)/i);
if(priceM)kvs.push({l:'Pris',v:priceM[1].trim()});
const launchM=raw.match(/(?:Launch|Lansering|Lanzamiento)[:\s]*([^.]+)/i);
if(launchM)kvs.push({l:'Launch',v:launchM[1].trim().substring(0,30)});
const tamM=raw.match(/TAM[:\s]*([€$£][\d\s.,\-KkMmBb]+)/i);
if(tamM)kvs.push({l:'TAM',v:tamM[1].trim()});
const beM=raw.match(/(?:break-even|breakeven)[:\s]*([^.]+)/i);
if(beM)kvs.push({l:'Break-even',v:beM[1].trim().substring(0,25)});
if(kvs.length){html+=`<div class="desc-kv">${kvs.map(k=>`<div class="desc-kv-item"><div class="kv-label">${k.l}</div><div class="kv-val">${k.v}</div></div>`).join('')}</div>`;}
return html;}
function hlFacts(s){return s.replace(/(€[\d\s.,KkMmBb\-]+)/g,'<span class="desc-fact">$1</span>').replace(/(\d+\s*(?:länder|countries|países|стран|%|månader|months|meses|месяцев))/gi,'<span class="desc-fact">$1</span>');}
function oppClick(txt){const tl=txt.toLowerCase();const match=N.find(n=>{const nl=gl(n.l).toLowerCase();return tl.includes(nl)||nl.includes(tl)||n.id.includes(tl.replace(/[^a-z]/g,'').substring(0,8));});if(match){fn(match.id);}else{const el=event.currentTarget;const tip=el.querySelector('.opp-tip');if(tip)tip.style.display=tip.style.display==='block'?'none':'block';}}

function aiAddMsg(role,text){
  AI_MSGS.push({role,text,time:new Date()});
  const mc=document.getElementById('ai-messages');
  const div=document.createElement('div');
  div.className='ai-msg '+role;
  let html=text.replace(/\[Navigate:\s*([^\]]+)\]/g,(m,name)=>{
    const node=N.find(n=>gl(n.l).toLowerCase().includes(name.toLowerCase())||n.id===name.toLowerCase().replace(/\s/g,'_'));
    if(node)return`<a onclick="fn('${node.id}');aiToggle()">${gl(node.l)} →</a>`;
    return name;
  });
  html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/\n/g,'<br>');
  div.innerHTML=`<div class="ai-bubble">${html}</div>`;
  mc.appendChild(div);
  mc.scrollTop=mc.scrollHeight;
}

function aiGetContext(){
  let ctx='CDP Ecosystem Data (Coaches Don\'t Play):\n\n';
  N.forEach(n=>{
    ctx+=`NODE: ${gl(n.l)} [${n.id}]  - Status: ${n.s}, Category: ${n.c}\n`;
    ctx+=`Description: ${gl(n.d).substring(0,300)}\n`;
    if(n.st)ctx+=`Strategic: ${gl(n.st).substring(0,200)}\n`;
    if(n.m)ctx+=`Metrics: ${n.m.map(m=>m.l+': '+m.v).join(', ')}\n`;
    if(n.bp){
      ctx+=`BUSINESS PLAN (${n.bp.length} sections):\n`;
      n.bp.forEach((s,i)=>{
        const tmp=document.createElement('div');tmp.innerHTML=s.body;
        ctx+=`  ${i+1}. ${gl(s.t)}: ${tmp.textContent.substring(0,300)}\n`;
      });
    }
    ctx+='\n';
  });
  ctx+='\nINVESTOR INSIGHTS:\n';
  IL.forEach(l=>{ctx+=`- ${gl(l.t)}: ${gl(l.d)}\n`});
  return ctx;
}

async function aiSend(){
  const input=document.getElementById('ai-input');
  const q=input.value.trim();
  if(!q)return;
  input.value='';
  aiAddMsg('user',q);

  const mc=document.getElementById('ai-messages');
  const typing=document.createElement('div');
  typing.className='ai-typing';
  typing.id='ai-typing';
  typing.textContent=LN==='sv'?'Tänker...':LN==='es'?'Pensando...':LN==='ru'?'Думаю...':'Thinking...';
  mc.appendChild(typing);
  mc.scrollTop=mc.scrollHeight;

  if(!AI_KEY){
    document.getElementById('ai-typing')?.remove();
    aiAddMsg('assistant',LN==='sv'?'Jag behöver en OpenAI API-nyckel för att fungera. Klicka på ⚙ ovan för att lägga till din nyckel.':'I need an OpenAI API key to function. Click ⚙ above to add your key.');
    return;
  }

  const sysPrompt=`You are CDP\'s AI assistant embedded in the "CDP Living System" interactive dashboard. You have deep knowledge of the entire Coaches Don\'t Play ecosystem.

IMPORTANT RULES:
- Answer in the same language the user writes in (Swedish, English, Spanish, or Russian)
- Keep answers concise but informative (2-4 paragraphs max)
- When referencing a node/section, include a navigation link using format: [Navigate: node_id] e.g. [Navigate: cdp_club]
- Use **bold** for emphasis
- If asked about the business plan, reference specific sections
- You represent CDP professionally  - be confident, knowledgeable, inspiring
${AI_ADMIN?'- ADMIN MODE: The user is an admin. They can ask you to draft changes to node descriptions, statuses, etc. Format change proposals clearly.':'- PUBLIC MODE: Read-only. Answer questions helpfully but do not suggest edits.'}

ECOSYSTEM DATA:
${aiGetContext()}`;

  const messages=[
    {role:'system',content:sysPrompt},
    ...AI_HIST.slice(-8),
    {role:'user',content:q}
  ];

  try{
    const res=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_KEY},
      body:JSON.stringify({model:'gpt-4o-mini',messages,temperature:0.7,max_tokens:1000})
    });
    const data=await res.json();
    document.getElementById('ai-typing')?.remove();

    if(data.error){
      aiAddMsg('assistant','Error: '+data.error.message);
      return;
    }

    const reply=data.choices[0].message.content;
    AI_HIST.push({role:'user',content:q},{role:'assistant',content:reply});
    aiAddMsg('assistant',reply);
  }catch(e){
    document.getElementById('ai-typing')?.remove();
    aiAddMsg('assistant','Connection error. Please check your API key and try again.');
  }
}

function aiDownload(){
  if(!AI_MSGS.length)return;
  let txt='CDP AI Assistant  - Conversation Log\n';
  txt+='Date: '+new Date().toISOString().split('T')[0]+'\n';
  txt+='='+ '='.repeat(50)+'\n\n';
  AI_MSGS.forEach(m=>{
    txt+=`[${m.role.toUpperCase()}] ${m.time.toLocaleTimeString()}\n${m.text}\n\n`;
  });
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cdp-ai-chat-'+new Date().toISOString().split('T')[0]+'.txt';
  a.click();
}
